[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autodev"
version = "0.5.0"
description = "AI-assisted Python code generation with bounded test-and-review loops."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AutoDev contributors" }]
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
web_test = ["httpx>=0.27,<1"]
openai_api = ["openai-agents>=0.1.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[project.scripts]
autodev = "autodev.cli:main"
autodev-web = "autodev.web.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autodev"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
